spring.datasource.url=jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:true}
server.port=${PORT:8080}

# Comma-separated origins allowed to call /api (the Vite dev server and the deployed frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://ledgerco-beta.vercel.app}

# Load sample loans on startup when the database is empty
app.demo-data=${APP_DEMO_DATA:true}
